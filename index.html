<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кыз узатуу</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f8eeee;
    font-family: Georgia, "Times New Roman", serif;
}

/* БАШКЫ ЭКРАН */
#cover {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: linear-gradient(135deg, #fffafa, #f3e0e4);

    transition: 1s;
}

#cover.hide {
    opacity: 0;
    visibility: hidden;
}

.title {
    color: #9b5966;
    font-size: 38px;
    margin-bottom: 35px;
    letter-spacing: 2px;
}

/* КОНВЕРТ */
.envelope {
    width: 310px;
    height: 210px;
    position: relative;
    cursor: pointer;
    filter: drop-shadow(0 10px 18px rgba(80,40,50,.2));
}

.envelope-body {
    position: absolute;
    inset: 0;
    background: #fff7f5;
    border: 1px solid #d8adb5;
    border-radius: 8px;
    overflow: hidden;
}

.envelope-body:before {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;

    border-left: 155px solid transparent;
    border-right: 155px solid transparent;
    border-bottom: 105px solid #f0d9dc;
}

.envelope-body:after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;

    border-top: 105px solid transparent;
    border-bottom: 105px solid transparent;
    border-left: 155px solid #f8e8e9;
}

.flap {
    position: absolute;
    top: 0;
    left: 0;

    border-left: 155px solid transparent;
    border-right: 155px solid transparent;
    border-top: 115px solid #e8c3ca;

    z-index: 3;

    transition: transform .8s;
    transform-origin: top;
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

.heart {
    position: absolute;
    z-index: 5;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 55px;
    height: 55px;

    border-radius: 50%;
    background: white;
    border: 1px solid #d5a8b1;

    display: flex;
    justify-content: center;
    align-items: center;

    color: #ad6674;
    font-size: 27px;
}

.subtitle {
    color: #9b5966;
    font-size: 16px;
    margin-top: 28px;
}

/* ЧАКЫРУУ */
#invitation {
    min-height: 100vh;
    display: none;

    justify-content: center;
    align-items: flex-start;

    padding: 20px 10px 60px;

    background: linear-gradient(135deg, #f9eeee, #fffafa);
}

#invitation.show {
    display: flex;
}

.card {
    width: 100%;
    max-width: 700px;
}

.card img {
    width: 100%;
    height: auto;
    display: block;

    border-radius: 12px;

    box-shadow: 0 10px 35px rgba(70,40,50,.2);
}

/* МУЗЫКА */
#musicButton {
    position: fixed;
    right: 18px;
    bottom: 18px;

    width: 55px;
    height: 55px;

    border-radius: 50%;
    border: 1px solid #d1a3ad;

    background: white;
    color: #9b5966;

    font-size: 22px;
    cursor: pointer;

    z-index: 30;

    box-shadow: 0 5px 15px rgba(70,40,50,.2);
}

@media(max-width:500px) {

    .title {
        font-size: 31px;
    }

    .envelope {
        width: 280px;
        height: 190px;
    }

    .flap {
        border-left-width: 140px;
        border-right-width: 140px;
    }

    .envelope-body:before {
        border-left-width: 140px;
        border-right-width: 140px;
    }

    .envelope-body:after {
        border-left-width: 140px;
    }

    #invitation {
        padding: 10px 5px 50px;
    }
}
</style>
</head>

<body>

<!-- БАШКЫ БЕТ -->
<div id="cover">

    <div class="title">
        Кыз узатуу
    </div>

    <div class="envelope" id="envelope">

        <div class="envelope-body"></div>

        <div class="flap"></div>

        <div class="heart">
            ♡
        </div>

    </div>

    <div class="subtitle">
        Конвертти ачуу үчүн басыңыз
    </div>

</div>


<!-- ЧАКЫРУУ СҮРӨТҮ -->
<div id="invitation">

    <div class="card">

        <img
            src="./invitation.jpg"
            alt="Кыз узатуу чакыруусу"
        >

    </div>

</div>


<!-- МУЗЫКА -->
<audio id="music" loop preload="auto">

    <source
        src="./a_176625.mp3"
        type="audio/mpeg"
    >

</audio>


<button id="musicButton" style="display:none;">
    🔊
</button>


<script>

const envelope = document.getElementById("envelope");
const cover = document.getElementById("cover");
const invitation = document.getElementById("invitation");
const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");

let playing = false;


/* КОНВЕРТТИ АЧУУ */

envelope.onclick = function() {

    envelope.classList.add("open");

    setTimeout(function() {

        cover.classList.add("hide");

        invitation.classList.add("show");

        musicButton.style.display = "block";

        music.play()
        .then(function() {

            playing = true;
            musicButton.innerHTML = "🔊";

        })
        .catch(function() {

            musicButton.innerHTML = "🔇";

        });

    }, 800);

};


/* МУЗЫКА */

musicButton.onclick = function() {

    if (playing) {

        music.pause();

        playing = false;

        musicButton.innerHTML = "🔇";

    } else {

        music.play();

        playing = true;

        musicButton.innerHTML = "🔊";

    }

};

</script>

</body>
</html>
