<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Кыз узатууга чакыруу</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background: #f7e8e5;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* ---------------- КОНВЕРТ ---------------- */

    .cover {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at 20% 20%, #fff 0, transparent 25%),
        radial-gradient(circle at 80% 80%, #efd0d0 0, transparent 30%),
        #f5e1df;
      transition: 1s ease;
    }

    .envelope-box {
      text-align: center;
    }

    .title {
      font-size: 38px;
      color: #8f3049;
      margin-bottom: 30px;
      font-style: italic;
    }

    .subtitle {
      color: #8b625f;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .envelope {
      width: 330px;
      height: 210px;
      background: #f8eee5;
      position: relative;
      margin: auto;
      cursor: pointer;
      border-radius: 5px;
      box-shadow: 0 15px 40px rgba(100, 50, 50, 0.25);
      transition: transform .5s;
    }

    .envelope:hover {
      transform: scale(1.04);
    }

    /* конверттин капкагы */

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 165px solid transparent;
      border-right: 165px solid transparent;
      border-top: 105px solid #e7c5b8;
      z-index: 3;
      transform-origin: top;
      transition: 1s ease;
    }

    /* конверттин төмөнкү бүктөмдөрү */

    .left-fold {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 0;
      border-top: 105px solid transparent;
      border-bottom: 105px solid transparent;
      border-left: 165px solid #edd8ce;
      z-index: 2;
    }

    .right-fold {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 0;
      height: 0;
      border-top: 105px solid transparent;
      border-bottom: 105px solid transparent;
      border-right: 165px solid #edd8ce;
      z-index: 2;
    }

    .bottom-fold {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 165px solid transparent;
      border-right: 165px solid transparent;
      border-bottom: 115px solid #e4c8bd;
      z-index: 4;
    }

    /* мөөр */

    .seal {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #a83c56;
      color: white;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 25px;
      box-shadow: 0 5px 15px rgba(0,0,0,.2);
    }

    .open-text {
      margin-top: 25px;
      color: #8f3049;
      font-size: 17px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      50% {
        opacity: .45;
      }
    }

    /* ---------------- ЧАКЫРУУ ---------------- */

    .invitation {
      display: none;
      width: 100%;
      min-height: 100vh;
      padding: 25px 15px;
      background:
        radial-gradient(circle at 10% 10%, #f3cdd0 0, transparent 20%),
        radial-gradient(circle at 90% 90%, #f1d4d0 0, transparent 25%),
        #f7e8e5;
    }

    .card {
      max-width: 850px;
      margin: auto;
      position: relative;
      background: #fffaf5;
      padding: 35px;
      border: 2px solid #c89a70;
      box-shadow: 0 15px 45px rgba(80,40,40,.2);
      border-radius: 8px;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid #d7b18a;
      pointer-events: none;
    }

    .card-image {
      width: 100%;
      display: block;
      border-radius: 5px;
      position: relative;
      z-index: 2;
    }

    /* Эгер сүрөттүн ичинде текст болсо, ошол бойдон көрсөтүлөт */

    .music {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 100;
    }

    .music button {
      width: 55px;
      height: 55px;
      border: none;
      border-radius: 50%;
      background: #a83c56;
      color: white;
      font-size: 23px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,.25);
    }

    /* ---------------- ТЕЛЕФОН ---------------- */

    @media (max-width: 600px) {

      .title {
        font-size: 29px;
      }

      .subtitle {
        font-size: 16px;
      }

      .envelope {
        width: 290px;
        height: 185px;
      }

      .flap {
        border-left-width: 145px;
        border-right-width: 145px;
        border-top-width: 93px;
      }

      .left-fold {
        border-top-width: 92px;
        border-bottom-width: 92px;
        border-left-width: 145px;
      }

      .right-fold {
        border-top-width: 92px;
        border-bottom-width: 92px;
        border-right-width: 145px;
      }

      .bottom-fold {
        border-left-width: 145px;
        border-right-width: 145px;
        border-bottom-width: 100px;
      }

      .card {
        padding: 12px;
      }
    }

    /* Конверт ачылганда */

    .opened .flap {
      transform: rotateX(180deg);
    }

    .hide {
      display: none !important;
    }

    .show {
      display: block !important;
    }
  </style>
</head>

<body>

  <!-- КОНВЕРТ -->

  <section class="cover" id="cover">

    <div class="envelope-box">

      <div class="title">
        Кыз узатуу
      </div>

      <div class="subtitle">
        Сизге атайын чакыруу
      </div>

      <div class="envelope" id="envelope">

        <div class="flap"></div>

        <div class="left-fold"></div>
        <div class="right-fold"></div>
        <div class="bottom-fold"></div>

        <div class="seal">
          ♡
        </div>

      </div>

      <div class="open-text">
        Конвертти ачуу үчүн басыңыз
      </div>

    </div>

  </section>


  <!-- ЧАКЫРУУ -->

  <section class="invitation" id="invitation">

    <div class="card">

      <!--
        Бул жерге өзүңүздүн чакыруу сүрөтүңүз чыгат.
        Файлдын аты: invitation.jpg
      -->

      <img
        src="invitation.jpg"
        alt="Кыз узатуу чакыруусу"
        class="card-image"
      >

    </div>

  </section>


  <!-- МУЗЫКА -->

  <div class="music" id="musicButton" style="display:none;">

    <button onclick="toggleMusic()" id="musicIcon">
      ♪
    </button>

  </div>


  <!-- Музыка файлы -->
  <audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>


  <script>

    const envelope = document.getElementById("envelope");
    const cover = document.getElementById("cover");
    const invitation = document.getElementById("invitation");
    const music = document.getElementById("music");
    const musicButton = document.getElementById("musicButton");
    const musicIcon = document.getElementById("musicIcon");

    envelope.addEventListener("click", function () {

      // Конверт ачылат
      cover.classList.add("opened");

      // Бир аздан кийин чакыруу чыгат
      setTimeout(function () {

        cover.classList.add("hide");
        invitation.classList.add("show");

        musicButton.style.display = "block";

        // Музыканы баштайт
        music.play().catch(function () {
          console.log("Музыка браузер тарабынан бөгөттөлдү.");
        });

      }, 900);

    });


    function toggleMusic() {

      if (music.paused) {

        music.play();

        musicIcon.innerHTML = "Ⅱ";

      } else {

        music.pause();

        musicIcon.innerHTML = "♪";

      }

    }

  </script>

</body>
</html>
