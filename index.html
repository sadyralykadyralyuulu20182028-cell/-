<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Кыз узатуу</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f8eeee;
}

/* =========================
   БАШКЫ БЕТ
========================= */

#cover {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at center, #fffafa 0%, #f9eeee 55%, #eedddd 100%);

    transition: opacity 1s ease, visibility 1s ease;
}

#cover.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.title {
    color: #9b5966;
    font-size: 38px;
    margin-bottom: 35px;
    text-align: center;
    letter-spacing: 2px;
}

.subtitle {
    color: #9b5966;
    font-size: 16px;
    margin-top: 28px;
    text-align: center;
}

/* Конверт */

.envelope {
    position: relative;
    width: 310px;
    height: 210px;
    cursor: pointer;
    filter: drop-shadow(0 12px 20px rgba(100, 50, 60, 0.18));

    transition: transform 0.3s ease;
}

.envelope:hover {
    transform: scale(1.04);
}

.envelope-body {
    position: absolute;
    left: 0;
    bottom: 0;

    width: 100%;
    height: 100%;

    background: #fff8f5;
    border: 1px solid #d9aeb6;
    border-radius: 8px;

    overflow: hidden;
}

/* Төмөнкү үч бурчтук */

.envelope-body::before {
    content: "";

    position: absolute;
    left: 0;
    bottom: 0;

    width: 0;
    height: 0;

    border-left: 155px solid transparent;
    border-right: 155px solid transparent;
    border-bottom: 105px solid #f0d9dc;
}

/* Сол жана оң капталдар */

.envelope-body::after {
    content: "";

    position: absolute;
    left: 0;
    bottom: 0;

    width: 0;
    height: 0;

    border-top: 105px solid transparent;
    border-bottom: 105px solid transparent;
    border-left: 155px solid #f8e8e9;
}

/* Үстүңкү капкак */

.flap {
    position: absolute;
    top: 0;
    left: 0;

    width: 0;
    height: 0;

    border-left: 155px solid transparent;
    border-right: 155px solid transparent;
    border-top: 115px solid #e8c3ca;

    z-index: 3;

    transform-origin: top center;

    transition: transform 0.8s ease;
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

/* Ортоңку гүл */

.heart {
    position: absolute;
    z-index: 5;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 55px;
    height: 55px;

    background: #fffafa;
    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    color: #b46b78;
    font-size: 25px;

    border: 1px solid #d7aab3;
}

/* =========================
   ЧАКЫРУУ
========================= */

#invitation {
    min-height: 100vh;

    display: none;

    justify-content: center;
    align-items: flex-start;

    padding: 25px 12px 60px;

    background:
        linear-gradient(
            135deg,
            #f9eeee,
            #fffafa,
            #f3e3e6
        );
}

#invitation.show {
    display: flex;
}

.invitation-card {
    width: 100%;
    max-width: 700px;

    text-align: center;
}

.invitation-card img {
    display: block;

    width: 100%;
    max-width: 700px;
    height: auto;

    margin: 0 auto;

    border-radius: 12px;

    box-shadow:
        0 10px 35px rgba(80, 40, 50, 0.20);

    background: white;
}

/* Музыка кнопка */

.music-button {
    position: fixed;

    right: 18px;
    bottom: 18px;

    width: 55px;
    height: 55px;

    border-radius: 50%;

    border: 1px solid #d2a3ad;

    background: #fff8f8;

    color: #9b5966;

    font-size: 23px;

    cursor: pointer;

    box-shadow: 0 5px 18px rgba(80, 40, 50, 0.18);

    z-index: 30;
}

.music-button:hover {
    transform: scale(1.05);
}

/* Телефон */

@media (max-width: 500px) {

    .title {
        font-size: 31px;
    }

    .envelope {
        width: 280px;
        height: 190px;
    }

    .envelope-body::before {
        border-left-width: 140px;
        border-right-width: 140px;
    }

    .envelope-body::after {
        border-left-width: 140px;
    }

    .flap {
        border-left-width: 140px;
        border-right-width: 140px;
    }

    .subtitle {
        font-size: 14px;
    }

    #invitation {
        padding: 12px 6px 50px;
    }

    .invitation-card img {
        border-radius: 8px;
    }
}
</style>
</head>

<body>

<!-- =========================
     БАШКЫ ЭКРАН
========================= -->

<div id="cover">

    <div class="title">
        Кыз узатуу
    </div>

    <div class="envelope" id="envelope">

        <div class="envelope-body"></div>

        <div class="flap"></div>

        <div class="heart">
            ♡
        </div>

    </div>

    <div class="subtitle">
        Конвертти ачуу үчүн басыңыз
    </div>

</div>


<!-- =========================
     ЧАКЫРУУ СҮРӨТҮ
========================= -->

<div id="invitation">

    <div class="invitation-card">

        <img
            src="./5ee7730803e19739bd5eb61a4e78a235.jpg"
            alt="Кыз узатуу чакыруусу"
        >

    </div>

</div>


<!-- =========================
     МУЗЫКА
========================= -->

<audio id="music" loop preload="auto">
    <source src="./a_176625.mp3" type="audio/mpeg">
</audio>

<button
    id="musicButton"
    class="music-button"
    style="display:none;"
>
    🔊
</button>


<script>

const envelope = document.getElementById("envelope");
const cover = document.getElementById("cover");
const invitation = document.getElementById("invitation");
const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");

let musicPlaying = false;


/* Конвертти ачуу */

envelope.addEventListener("click", function() {

    envelope.classList.add("open");

    setTimeout(function() {

        cover.classList.add("hide");

        invitation.classList.add("show");

        musicButton.style.display = "block";

        music.play()
            .then(function() {
                musicPlaying = true;
                musicButton.textContent = "🔊";
            })
            .catch(function() {
                musicPlaying = false;
                musicButton.textContent = "🔇";
            });

    }, 900);

});


/* Музыканы күйгүзүү / өчүрүү */

musicButton.addEventListener("click", function() {

    if (musicPlaying) {

        music.pause();

        musicPlaying = false;

        musicButton.textContent = "🔇";

    } else {

        music.play()
            .then(function() {

                musicPlaying = true;

                musicButton.textContent = "🔊";

            });

    }

});

</script>

</body>
</html>
